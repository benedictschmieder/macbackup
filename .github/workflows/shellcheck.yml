name: shellcheck
on: [push, pull_request]
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: .
          additional_files: bin/macbackup
        env:
          SHELLCHECK_OPTS: -e SC1091 -e SC2312
