# macbackup settings. Bash syntax, sourced by macbackup on every run.
# This file lives in the backup repository so a restored Mac keeps backing up the same things.
# Entries that do not exist on a Mac are skipped silently.

# Modules to run. Available: brew dotfiles vscode defaults launchagents system
MODULES="brew dotfiles vscode defaults launchagents system"

# Time of the daily backup (24 hour clock, local time). Re-run 'macbackup schedule install' after changing.
BACKUP_HOUR=12
BACKUP_MINUTE=0

# Back up all of ~/.config (every tool that follows the XDG convention) in addition to DOTFILES.
DOTFILES_AUTO_CONFIG=1

# Files larger than this are skipped; configuration is small, state and caches are not.
DOTFILES_MAX_SIZE_KB=1024

# Files and directories relative to $HOME. Directories are copied recursively.
DOTFILES=(
  .zshrc
  .zprofile
  .zshenv
  .zlogin
  .bashrc
  .bash_profile
  .profile
  .hushlogin
  .gitconfig
  .gitignore_global
  .editorconfig
  .vimrc
  .tmux.conf
  .curlrc
  .wgetrc
  .ssh/config
  .config/git
  .config/gh/config.yml
  .config/micro/settings.json
  .config/micro/bindings.json
  .config/micro/colorschemes
  .config/thefuck
  .config/tigervnc
  .config/wireshark/preferences
  .config/wireshark/profiles
  .config/powershell
  .config/nvim
  .claude/CLAUDE.md
  .claude/settings.json
  .claude/keybindings.json
  .claude/agents
  .claude/commands
  .claude/skills
)

# Names never copied, matched anywhere inside the DOTFILES entries (rsync exclude syntax).
EXCLUDE_PATTERNS=(
  .DS_Store
  '*history*'
  '*.log'
  hosts.yml
  'known_hosts*'
  'id_*'
  '*.pem'
  '*.key'
  '*.p12'
  '*.pfx'
  '*.crt'
  .npmrc
  node_modules
  __pycache__
  '*.pyc'
  .git
  micro/backups
  micro/buffers
  'wireshark/recent*'
  macbackup
)

# Export the preferences of every app found in DEFAULTS_APP_DIRS (by bundle identifier),
# in addition to DEFAULTS_DOMAINS. New apps are picked up automatically.
DEFAULTS_AUTO_APPS=1
DEFAULTS_APP_DIRS=(/Applications "$HOME/Applications")

# Domains never exported, e.g. apps whose preferences are pure state.
DEFAULTS_EXCLUDE_DOMAINS=(
)

# Exports larger than this are skipped: such domains hold state or caches rather than settings.
DEFAULTS_MAX_SIZE_KB=256

# Preference domains always exported (find others with: defaults domains | tr ',' '\n').
DEFAULTS_DOMAINS=(
  NSGlobalDomain
  com.apple.dock
  com.apple.finder
  com.apple.desktopservices
  com.apple.AppleMultitouchTrackpad
  com.apple.driver.AppleBluetoothMultitouch.trackpad
  com.apple.driver.AppleBluetoothMultitouch.mouse
  com.apple.HIToolbox
  com.apple.symbolichotkeys
  com.apple.controlcenter
  com.apple.menuextra.clock
  com.apple.screencapture
  com.apple.screensaver
  com.apple.spaces
  com.apple.WindowManager
  com.apple.Terminal
  com.apple.TextEdit
  com.knollsoft.Rectangle
  org.p0deje.Maccy
  cc.ffitch.shottr
  com.pilotmoon.scroll-reverser
  com.bjango.istatmenus
  com.colliderli.iina
  com.choosyosx.Choosy
  com.dwarfland.hiddenbar
)

# Keys removed from the exported domains because they change constantly or hold license keys.
# Format: domain:key, or *:key for every domain.
DEFAULTS_STRIP_KEYS=(
  cc.ffitch.shottr:kc-license
  com.apple.dock:recent-apps
  com.apple.dock:mod-count
  com.apple.dock:last-messagetrace-stamp
  com.apple.finder:FXRecentFolders
  com.apple.finder:GoToField
  com.apple.finder:GoToFieldHistory
  com.apple.finder:FXDesktopVolumePositions
  com.apple.finder:RecentMoveAndCopyDestinations
  com.apple.finder:FXSyncExtensionToolbarItemsPendingAdd
  com.apple.finder:FXSyncExtensionToolbarItemsPendingRemove
  com.apple.spaces:SpacesDisplayConfiguration
  NSGlobalDomain:NSLinguisticDataAssetsRequestTime
  NSGlobalDomain:NSLinguisticDataAssetsRequestLastInterval
  NSGlobalDomain:NSLinguisticDataAssetsRequested
  NSGlobalDomain:NSLinguisticDataAssetsRequestedByChecker
  NSGlobalDomain:AKLastIDMSEnvironment
  NSGlobalDomain:AKLastLocale
)

# Extended regular expressions; matching top-level keys are removed from every exported domain.
# Covers window positions, file dialog state, telemetry and update-check timestamps.
DEFAULTS_STRIP_KEY_PATTERNS=(
  '^NSWindow Frame '
  '^NSSplitView Subview Frames '
  '^NSNav'
  '^NSOSPLastRootDirectory$'
  '^NSStatusItem Preferred Position '
  'Telemetry'
  '^SULastCheckTime$'
  '^SUHasLaunchedBefore$'
  '^NSDocumentSuppressTempVersionStoreWarning$'
)

# VS Code user directory (settings.json, keybindings.json, snippets, mcp.json live here).
VSCODE_USER_DIR="$HOME/Library/Application Support/Code/User"

# Keys inside exported preferences whose name looks like a license, password, token or similar
# are removed automatically (the whole top-level key), so app license keys never reach the repository.

# Extended regular expressions. A secret scanner finding whose line matches one of them is ignored.
# Only use this for confirmed false positives.
SECRET_ALLOWLIST=(
)
